name: RSS Feed Update

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Google Chrome
      run: |
        # Google Chromeのインストール（Snapではなくdebパッケージを使用）
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        # ChromeDriverのインストール
        sudo apt-get install -y chromium-chromedriver
        # バージョン確認
        google-chrome --version
        chromedriver --version
    
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run RSS generator
      run: |
        python generate_rss.py
      env:
        # ChromeDriverのパスを明示的に設定
        PATH: /usr/lib/chromium-browser:$PATH
    
    - name: Check if feed.xml exists
      id: check_feed
      run: |
        if [ -f "feed.xml" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "feed.xml exists"
          cat feed.xml | head -20
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "feed.xml NOT found!"
          # デバッグ用にディレクトリ内容を表示
          ls -la
        fi
    
    - name: Commit and push if changed
      if: steps.check_feed.outputs.exists == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git diff --staged --quiet || git commit -m "Update RSS feed $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
